<?xml version="1.0"?><!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <dir>~/.local/share/fonts</dir>
  <alias binding="same"><family>Songti SC</family><prefer><family>Noto Serif CJK SC</family></prefer></alias>
  <alias binding="same"><family>STSong</family><prefer><family>Noto Serif CJK SC</family></prefer></alias>
  <alias binding="same"><family>Noto Serif SC</family><prefer><family>Noto Serif CJK SC</family></prefer></alias>
  <alias binding="same"><family>PingFang SC</family><prefer><family>Noto Sans SC</family></prefer></alias>
  <alias binding="same"><family>Hiragino Sans GB</family><prefer><family>Noto Sans SC</family></prefer></alias>
  <alias binding="same"><family>Menlo</family><prefer><family>Liberation Mono</family></prefer></alias>
  <alias binding="same"><family>SF Mono</family><prefer><family>Liberation Mono</family></prefer></alias>
  <alias binding="same"><family>Avenir Next</family><prefer><family>Liberation Sans</family></prefer></alias>
</fontconfig>
