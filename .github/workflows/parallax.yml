name: Parallax 2.5D
on:
  workflow_dispatch:
    inputs:
      image: {description: 原图, required: true, default: blender/assets/ep54_64.png}
      script: {description: 镜头脚本, required: true, default: blender/parallax.py}
      frames: {description: 总帧数, required: true, default: '120'}
      chunks: {description: 并行段数, required: true, default: '12'}
      spp: {description: 采样, required: true, default: '16'}
jobs:
  prep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip, cache-dependency-path: .github/workflows/parallax.yml}
      - uses: actions/cache@v4
        with: {path: ~/.cache/huggingface, key: hf-da2-large}
      - run: pip install -q torch --index-url https://download.pytorch.org/whl/cpu && pip install -q transformers pillow opencv-python-headless numpy
      - run: python blender/prep.py ${{ inputs.image }} blender/assets/p
      - uses: actions/upload-artifact@v4
        with: {name: assets, path: blender/assets/p/, retention-days: 3}
  plan:
    runs-on: ubuntu-latest
    outputs: {matrix: '${{ steps.p.outputs.matrix }}'}
    steps:
      - id: p
        run: node -e "const n=+process.argv[1],k=+process.argv[2],s=Math.ceil(n/k),m=[];for(let i=0;i*s<n;i++)m.push({i,a:i*s+1,b:Math.min(n,(i+1)*s)});console.log('matrix='+JSON.stringify({include:m}))" ${{ inputs.frames }} ${{ inputs.chunks }} >> $GITHUB_OUTPUT
  render:
    needs: [prep, plan]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy: {fail-fast: true, matrix: '${{ fromJson(needs.plan.outputs.matrix) }}'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with: {path: bl, key: bl-4.2.3}
      - uses: actions/download-artifact@v4
        with: {name: assets, path: blender/assets/p}
      - run: |
          if [ ! -x bl/blender ]; then curl -sL --retry 3 https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz | tar xJ && mv blender-4.2.3-linux-x64 bl; fi
          (timeout 60 sudo apt-get update -qq || true); timeout 150 sudo apt-get install -y -qq libxi6 libxkbcommon0 libxxf86vm1 libxfixes3 libxrender1 libgl1 libsm6 >/dev/null || true
      - run: NF=${{ inputs.frames }} SPP=${{ inputs.spp }} bl/blender -b -noaudio -P ${{ inputs.script }} -o $PWD/out/f_#### -s ${{ matrix.a }} -e ${{ matrix.b }} -a 2>&1 | grep -vE "Sample|Rendered|Updating|Synchroniz|Loading|Building" | tail -n 60
      - run: ls out | head; test $(ls out | wc -l) -gt 0
      - uses: actions/upload-artifact@v4
        with: {name: 'bl-${{ matrix.i }}', path: out/, retention-days: 3}
  join:
    needs: render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {pattern: 'bl-*', path: out, merge-multiple: true}
      - run: |
          (timeout 60 sudo apt-get update -qq || true); for i in 1 2 3; do timeout 150 sudo apt-get install -y -qq ffmpeg >/dev/null && break; done
          ffmpeg -v error -framerate 24 -start_number 1 -i out/f_%04d.png -c:v libx264 -crf 15 -preset slow -pix_fmt yuv420p -movflags +faststart parallax.mp4
      - uses: actions/upload-artifact@v4
        with: {name: parallax-video, path: parallax.mp4, retention-days: 7}
