# 并行渲染：Actions → Render parallel → Run workflow。
# 画面拆成 N 段同时渲染（无声），audio job 同时在云端合成配乐+音效；join 无损拼接画面并合上声音，产物就是成片。
# 仓库为私有（含配乐）。
name: Render parallel
on:
  workflow_dispatch:
    inputs:
      ep:
        description: 作品 ID（Composition id）
        required: true
        default: ep52-tang-beacon
      chunks:
        description: 分几段并行（1–20）
        required: true
        default: '20'
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - id: p
        run: |
          N=$(npx remotion compositions src/index.ts 2>/dev/null | awk -v id="${{ inputs.ep }}" '$1==id{print $4}')
          echo "frames=$N"
          test -n "$N"
          node -e "const n=+process.argv[1],k=+process.argv[2];const s=Math.ceil(n/k);const m=[];for(let i=0;i*s<n;i++)m.push({i,a:i*s,b:Math.min(n,(i+1)*s)-1});console.log('matrix='+JSON.stringify({include:m}))" "$N" "${{ inputs.chunks }}" >> $GITHUB_OUTPUT
  render:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - name: 字体
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-color-emoji fonts-liberation >/dev/null
          mkdir -p ~/.config/fontconfig && cp .github/render/fonts.conf ~/.config/fontconfig/fonts.conf && fc-cache -f >/dev/null
      - run: npm ci
      - name: 渲染第 ${{ matrix.i }} 段（帧 ${{ matrix.a }}–${{ matrix.b }}）
        run: |
          mkdir -p public/audio/${{ inputs.ep }} out
          python3 -c "import wave;w=wave.open('public/audio/${{ inputs.ep }}/mix.wav','wb');w.setnchannels(2);w.setsampwidth(2);w.setframerate(48000);w.writeframes(bytes(4*48000));w.close()"
          npx remotion render src/index.ts ${{ inputs.ep }} out/part-$(printf %02d ${{ matrix.i }}).mp4 \
            --frames=${{ matrix.a }}-${{ matrix.b }} --muted --codec=h264 --crf=18 --concurrency=4
      - uses: actions/upload-artifact@v4
        with: {name: 'part-${{ matrix.i }}', path: out/, retention-days: 3}
  audio:
    runs-on: ubuntu-latest
    env: {EP: '${{ inputs.ep }}'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null && pip3 install -q numpy
      - run: npm ci
      - name: 配乐 + 音效 + 混音
        run: |
          mkdir -p public/audio/$EP
          node audio/episodes/$EP.mjs
          npx tsx -e "import('./src/episodes/$EP/timeline.ts').then(m=>console.log(JSON.stringify({SFX:m.SFX,DURATION:m.DURATION,FPS:m.FPS})))" > sfx.json
          python3 audio/episodes/${EP%%-*}_mix.py sfx.json mix.wav
          ffmpeg -hide_banner -i mix.wav -af loudnorm=print_format=summary -f null - 2>&1 | grep -E "Input (Integrated|True Peak)"
      - uses: actions/upload-artifact@v4
        with: {name: 'mix', path: mix.wav, retention-days: 3}
  join:
    needs: [render, audio]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {pattern: 'part-*', path: parts, merge-multiple: true}
      - uses: actions/download-artifact@v4
        with: {name: mix, path: .}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - run: |
          ls parts | sort | sed "s#^#file 'parts/#; s#\$#'#" > list.txt
          ffmpeg -v error -f concat -safe 0 -i list.txt -c copy video.mp4
          ffmpeg -v error -i video.mp4 -i mix.wav -map 0:v -map 1:a -c:v copy -c:a aac -b:a 320k -shortest -movflags +faststart final.mp4
          ffprobe -v error -show_entries stream=codec_type,duration -of csv=p=0 final.mp4
      - uses: actions/upload-artifact@v4
        with: {name: '${{ inputs.ep }}-final', path: final.mp4, retention-days: 7}
