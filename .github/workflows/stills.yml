# 云端检查帧：每帧一个并行任务，最后拼成一张总览图
name: Stills
on:
  workflow_dispatch:
    inputs:
      ep: {description: 作品 ID, required: true, default: ep54-yangguang-canal}
      frames: {description: 帧号（逗号分隔）, required: true}
      scale: {description: 缩放, required: true, default: '0.5'}
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs: {matrix: '${{ steps.p.outputs.matrix }}'}
    steps:
      - id: p
        run: echo "matrix=$(echo '${{ inputs.frames }}' | tr -d ' ' | jq -Rc 'split(",")|map(select(length>0)|tonumber)|{f:.}')" >> $GITHUB_OUTPUT
  still:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - name: 字体
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-color-emoji fonts-liberation >/dev/null
          mkdir -p ~/.config/fontconfig && cp .github/render/fonts.conf ~/.config/fontconfig/fonts.conf && fc-cache -f >/dev/null
      - run: npm ci
      - run: |
          mkdir -p out
          npx remotion still src/index.ts ${{ inputs.ep }} out/f$(printf %05d ${{ matrix.f }}).jpg --frame=${{ matrix.f }} --scale=${{ inputs.scale }} --image-format=jpeg --jpeg-quality=85 --timeout=120000
      - uses: actions/upload-artifact@v4
        with: {name: 'f-${{ matrix.f }}', path: out/, retention-days: 2}
  sheet:
    needs: still
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {pattern: 'f-*', path: s, merge-multiple: true}
      - run: sudo apt-get install -y -qq imagemagick >/dev/null; ls s; montage s/*.jpg -tile 2x -geometry 960x540+4+4 sheet.jpg
      - uses: actions/upload-artifact@v4
        with: {name: stills-sheet, path: 'sheet.jpg', retention-days: 2}
